name: Validate SignMaster core

on:
  push:
    paths:
      - "src/NGT.SignMaster/Core/**"
      - "src/NGT.SignMaster/Resources/default-signs.tsv"
      - "tests/NGT.SignMaster.CoreTests/**"
      - "tools/validate_sign_data.py"
      - ".github/workflows/validate-sign-data.yml"
  pull_request:
    paths:
      - "src/NGT.SignMaster/Core/**"
      - "src/NGT.SignMaster/Resources/default-signs.tsv"
      - "tests/NGT.SignMaster.CoreTests/**"
      - "tools/validate_sign_data.py"
      - ".github/workflows/validate-sign-data.yml"

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner starts
        run: |
          echo "runner started"
          python3 --version
          dotnet --version

  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository at current ref
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: git clone --depth 1 --branch "$REF_NAME" "https://github.com/$REPOSITORY.git" repo
      - name: Validate sign catalog
        run: cd repo && python3 tools/validate_sign_data.py

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository at current ref
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: git clone --depth 1 --branch "$REF_NAME" "https://github.com/$REPOSITORY.git" repo
      - name: Compile and run resolver tests
        run: cd repo && dotnet run --project tests/NGT.SignMaster.CoreTests/NGT.SignMaster.CoreTests.csproj --configuration Release
