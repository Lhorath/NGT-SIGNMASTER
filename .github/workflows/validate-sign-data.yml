name: Validate sign data

on:
  push:
    paths:
      - "src/NGT.SignMaster/Resources/default-signs.tsv"
      - "tools/validate_sign_data.py"
      - ".github/workflows/validate-sign-data.yml"
  pull_request:
    paths:
      - "src/NGT.SignMaster/Resources/default-signs.tsv"
      - "tools/validate_sign_data.py"
      - ".github/workflows/validate-sign-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_sign_data.py
